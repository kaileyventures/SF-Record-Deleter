<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#032D60" />
            <stop offset="100%" stop-color="#060e17" />
        </linearGradient>
        
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0176D3" />
            <stop offset="100%" stop-color="#014486" />
        </linearGradient>

        <linearGradient id="binGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ef4444" />
            <stop offset="100%" stop-color="#991b1b" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
    <rect width="126" height="126" x="1" y="1" rx="31" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

    <path d="M 86 48 C 86 36 75 28 62 30 C 50 25 36 34 36 48 C 24 50 18 62 22 74 C 26 86 38 92 50 92 L 82 92 C 96 92 106 82 106 68 C 106 56 96 49 86 48 Z" fill="url(#cloudGrad)" opacity="0.8"/>
    
    <g transform="translate(44, 44)" fill="url(#binGrad)" filter="url(#glow)">
        <path d="M 32 4 L 32 6 L 10 6 L 10 4 L 16 4 L 16 2 L 26 2 L 26 4 Z" />
        <path d="M 12 8 L 14 36 L 28 36 L 30 8 Z" />
    </g>
</svg>
