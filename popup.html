<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --sf-primary: #0176D3; 
            --sf-hover: #014486;
            --sf-navy: #032D60;
            --bg-deep: #060e17;
            --card-glass: rgba(13, 24, 42, 0.65);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-red: #ef4444;
            --success-green: #22c55e;
            --warning-yellow: #f59e0b;
        }

        body { 
            width: 300px; padding: 16px; font-family: 'Inter', sans-serif; margin: 0; 
            background: radial-gradient(130% 130% at 50% -10%, var(--sf-navy) 0%, var(--bg-deep) 100%);
            color: var(--text-main); overflow-x: hidden;
        }

        .container { display: flex; flex-direction: column; gap: 14px; }

        #validTabScreen, #invalidTabScreen { 
            display: none; flex-direction: column; gap: 12px; background: var(--card-glass);
            backdrop-filter: blur(12px); border: 1px solid var(--border-light);
            border-top: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
            padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 4px; }
        
        .logo-wrapper { 
            width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; 
            justify-content: center; margin-bottom: 12px; background: var(--bg-deep);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); padding: 4px; border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Hover Effect */
        .logo-wrapper:hover { 
            box-shadow: 0 0 25px var(--sf-primary);
            transform: translateY(-2px);
        }

        /* Success Animation: Trigger this class in JS */
        .success-glow {
            animation: success-pulse 1s ease-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes success-pulse {
            0% { box-shadow: 0 0 0px var(--success-green); }
            50% { box-shadow: 0 0 30px var(--success-green); }
            100% { box-shadow: 0 0 0px var(--sf-primary); }
        }
        
        .logo-wrapper img { width: 100%; height: 100%; border-radius: 10px; object-fit: contain; }
        
        .header h3 { margin: 0 0 4px 0; font-size: 17px; font-weight: 700; }
        
        label { font-size: 11px; font-weight: 600; margin-bottom: 6px; display: block; color: var(--text-muted); text-transform: uppercase; }
        
        .input-group { display: flex; flex-direction: column; }

        select, input, textarea { 
            width: 100%; box-sizing: border-box; border-radius: 12px; 
            background: rgba(4, 9, 18, 0.8); border: 1px solid var(--border-light); 
            color: var(--text-main); padding: 10px 12px; font-size: 13px; 
            outline: none; transition: all 0.3s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--sf-primary);
            box-shadow: 0 0 10px rgba(1, 118, 211, 0.3);
        }

        textarea { 
            resize: none; 
            font-family: monospace; 
            font-size: 11px; 
            color: #bae6fd;
            scrollbar-width: thin;
            scrollbar-color: var(--sf-primary) rgba(4, 9, 18, 0.8);
            min-height: 80px;
        }

        /* Custom Scrollbar Styling */
        textarea::-webkit-scrollbar, #status::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        textarea::-webkit-scrollbar-track, #status::-webkit-scrollbar-track {
            background: rgba(4, 9, 18, 0.8);
            border-radius: 10px;
        }

        textarea::-webkit-scrollbar-thumb, #status::-webkit-scrollbar-thumb {
            background: var(--sf-primary);
            border-radius: 10px;
            transition: background 0.3s;
        }

        textarea::-webkit-scrollbar-thumb:hover, #status::-webkit-scrollbar-thumb:hover {
            background: var(--sf-hover);
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        button { 
            background: linear-gradient(135deg, var(--sf-primary), var(--sf-hover)); 
            color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; 
            display: flex; align-items: center; justify-content: center; 
            gap: 8px; box-shadow: 0 4px 15px rgba(1, 118, 211, 0.4);
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(1, 118, 211, 0.6);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Button Styles - Updated from JS */
        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #991b1b) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;
        }

        .btn-delete:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6) !important;
        }

        .btn-insert {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4) !important;
        }

        .btn-insert:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6) !important;
        }

        .btn-update {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4) !important;
        }

        .btn-update:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6) !important;
        }

        #cancelBtn {
            background: linear-gradient(135deg, var(--warning-yellow), #d97706) !important;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4) !important;
        }

        #cancelBtn:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6) !important;
        }

        .btn-error { 
            background: linear-gradient(135deg, var(--error-red), #991b1b) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;
        }

        .btn-error:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6) !important;
        }

        #status { 
            font-size: 11px; text-align: center; margin-top: 4px; color: #7dd3fc; 
            background: rgba(0,0,0,0.4); border-radius: 10px; padding: 10px; 
            max-height: 100px; overflow-y: auto; word-break: break-word; display: none;
            line-height: 1.4;
            border: 1px solid var(--border-light);
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #status {
            animation: slideIn 0.3s ease-out;
        }

        /* Info badge */
        .info-badge {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="validTabScreen">
            <div class="header">
                <div class="logo-wrapper" id="mainLogo">
                    <img src="icon48.png" alt="SF Record Deleter">
                </div>
                <h3>SF Record Deleter</h3>
            </div>
            <div class="input-group">
                <label>Action</label>
                <select id="action">
                    <option value="delete">Delete Records</option>
                    <option value="insert">Insert Records</option>
                    <option value="update">Update Records</option>
                </select>
            </div>
            <div class="input-group">
                <label>Object API Name</label>
                <input type="text" id="objectName" value="CISC__Lead__c" placeholder="e.g. Account, Lead__c">
            </div>
            <div class="input-group">
                <label>Data Payload</label>
                <textarea id="dataInput" placeholder="Paste IDs (for delete) or JSON array (for insert/update)"></textarea>
                <div class="info-badge" id="payloadInfo">Waiting for input...</div>
            </div>
            <div class="button-group">
                <button id="executeBtn">Execute Pipeline</button>
            </div>
            <div id="status"></div>
        </div>

        <div id="invalidTabScreen">
            <div class="header">
                <div class="logo-wrapper" style="background: #991b1b; animation: none;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                </div>
                <h3>Environment Locked</h3>
                <p style="color: var(--text-muted); font-size: 12px;">Restricted to Salesforce CRM.</p>
            </div>
            <button id="findSfBtn" class="btn-error">Switch to Salesforce Tab</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
